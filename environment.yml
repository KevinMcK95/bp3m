name: bp3m
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - numpy
  - scipy
  - astropy
  - astroquery
  - matplotlib
  - tqdm
  - pandas
  - joblib
  - jax
  - jaxlib
  - pip
  - pip:
    - gaiadr3-zeropoint>=0.1.0   # Lindegren+21 parallax zero point (bp3m/gaia_zp.py)
    - bp3m
