[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bp3m"
version = "2.0.0"
description = "Bayesian Pipeline for Proper Motion measurements using HST and Gaia"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kevin McKinnon", email = "kevinmckinnon95@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy>=1.15",   # scipy.special.sph_harm_y (bp3m/gaia_sys/qso_sys.py)
    "astropy",
    "astroquery",
    "matplotlib",
    "tqdm",
    "pandas",
    "joblib",
    "jax",
    "jaxlib",
    "gaiadr3-zeropoint>=0.1.0",   # Lindegren+21 Gaia DR3 parallax zero point (bp3m/gaia_zp.py; LGPLv3+, used as a library)
    "nbconvert",
    "ipykernel",
    "jupyter",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/KevinMcK95/bp3m"
Repository = "https://github.com/KevinMcK95/bp3m"
Paper = "https://doi.org/10.3847/1538-4357/ad5ff6"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
bp3m = "bp3m_run:main"
bp3m-v2 = "bp3m.pipeline.run_iterate_v2:main"
bp3m-pop-fit = "bp3m.pipeline.run_pop_fit:main"
bp3m-pop-fit-rotation = "bp3m.pipeline.run_pop_fit_rotation:main"
bp3m-pop-fit-v2 = "bp3m.pipeline.run_pop_fit_v2:main"
bp3m-notebooks = "bp3m.notebooks_cmd:main"
bp3m-fix-gdc = "bp3m.pipeline.fix_gdc_catalogs:main"
bp3m-setup = "bp3m.setup:main"
bp3m-synthetic = "bp3m.pipeline.run_synthetic:main"
bp3m-collect-distortion = "bp3m.pipeline.collect_epoch_distortion:main"
bp3m-export-labels = "bp3m.pipeline.residual_export:main"

[tool.setuptools]
py-modules = ["bp3m_run"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["build*", "tests*", "tests_pypass*"]

[tool.setuptools.package-data]
"bp3m.notebooks" = ["*.ipynb"]
"bp3m" = ["data/gaia_sys/*.json", "data/gaia_sys/*.npz"]   # vendored Gaia model inputs (gaia_corrected; sha256-checked)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
